services:
  app:
    image: cinebook:local
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${APP_PORT:-3080}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /app/data/cinebook.sqlite
      TZ: Asia/Kolkata
    volumes:
      - cinebook-data:/app/data
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

volumes:
  cinebook-data:
