name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "feat/**"
      - "fix/**"
      - "ci/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, application build and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run API and startup tests
        run: npm test
      - name: Build the application
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
      - name: Verify the Docker image builds
        run: docker build --tag cinebook:ci .
      - name: Verify container health, native SQLite and booking persistence
        run: |
          docker tag cinebook:ci cinebook:local
          npm run test:docker
          node scripts/test-cloud.mjs
          node scripts/test-turso-network.mjs
      - name: Save test reports and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: ci-test-results
          path: |
            .artifacts/
            test-results/
            !**/*.sqlite*
            !**/*.db*
            !**/.env*
            !.artifacts/*private*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
